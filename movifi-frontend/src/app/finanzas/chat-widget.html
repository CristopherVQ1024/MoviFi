@if (abierto()) {
  <section class="ventana" role="dialog" aria-label="Copiloto con IA">
    <header>
      <span class="luz"></span>
      <strong>Copiloto</strong>
      <button type="button" (click)="abierto.set(false)" aria-label="Cerrar chat">✕</button>
    </header>

    <div class="mensajes" #lista>
      @for (m of mensajes(); track $index) {
        <p [class]="m.de">{{ m.texto }}</p>
      }
      @if (pensando()) {
        <p class="ia pensando"><i></i><i></i><i></i></p>
      }
    </div>

    @if (mensajes().length === 1) {
      <div class="sugerencias">
        @for (s of sugerencias; track s) {
          <button type="button" (click)="enviar(s)">{{ s }}</button>
        }
      </div>
    }

    <form (ngSubmit)="enviar()">
      <input name="texto" [(ngModel)]="texto" placeholder="Escribe tu pregunta…" autocomplete="off" />
      <button type="submit" [disabled]="pensando() || !texto.trim()" aria-label="Enviar">➤</button>
    </form>
  </section>
}

<button class="burbuja" type="button" (click)="abierto.set(!abierto())" [class.abierta]="abierto()" aria-label="Abrir chat con el copiloto">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" />
    <path d="M9 12h.01M12 12h.01M15 12h.01" />
  </svg>
</button>
